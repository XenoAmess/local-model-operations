generator:
  model_path: /home/ubuntu/workspace/xenoamess_bake_videos/models/FastH3-Omni-NVFP4-QAD
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit_vsa
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: true
      lazy_module_load: false
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    workload_type: i2v
    vae_tiling: true
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      h3_vsa_fp4:
        enabled: true
        prefix_precision: fp8
        two_level_p: true
        smooth_k: true
      VSA_sparsity: 0.9
      VSA_tile_size: 128
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: false
      video_decode_backend: h3-vae
      h3_vae_nvfp4_decoder: /home/ubuntu/workspace/xenoamess_bake_videos/models/FastH3-Omni-NVFP4-QAD/vae_decoder_nvfp4/decoder-nvfp4.safetensors

server:
  host: 0.0.0.0
  port: 8001
  output_dir: /home/ubuntu/workspace/xenoamess_bake_videos/outputs/omni-api
  served_model_name: fasth3-omni
  media_roots:
    - /home/ubuntu/workspace/xenoamess_bake_videos/omni-web/uploads

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 8
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
