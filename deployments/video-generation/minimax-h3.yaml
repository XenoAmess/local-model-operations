generator:
  model_path: /home/ubuntu/workspace/xenoamess_bake_videos/models/MiniMax-H3-Ref2VA-BF16
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: false
      lazy_module_load: true
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    workload_type: i2v
    vae_tiling: true
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: TORCH_SDPA
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: false
      video_decode_backend: h3-vae

server:
  host: 0.0.0.0
  port: 8001
  output_dir: /home/ubuntu/workspace/xenoamess_bake_videos/outputs/minimax-h3-api
  served_model_name: minimax-h3-ref2va
  media_roots:
    - /home/ubuntu/workspace/xenoamess_bake_videos/omni-web/uploads

default_request:
  negative_prompt: ""
  sampling:
    height: 480
    width: 832
    num_frames: 124
    fps: 24
    num_inference_steps: 50
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
