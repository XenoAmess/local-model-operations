generator:
  model_path: /home/ubuntu/workspace/xenoamess_bake_videos/models/FastH3-Omni-BF16
  engine:
    num_gpus: 1
    execution_backend: uni
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: false
      lazy_module_load: true
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    workload_type: i2v
    vae_tiling: true
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      h3_vsa_fp4:
        enabled: false
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: false
      video_decode_backend: h3-vae

server:
  host: 127.0.0.1
  port: 8003
  output_dir: /home/ubuntu/workspace/xenoamess_bake_videos/outputs/omni-bf16-api
  served_model_name: fasth3-omni-bf16
  media_roots:
    - /home/ubuntu/workspace/xenoamess_bake_videos/omni-web/uploads
    - /home/ubuntu/workspace/xenoamess_bake_videos/omni-web/cache
    - /home/ubuntu/workspace/xenoamess_bake_videos/outputs/video-queue/uploads

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 8
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
